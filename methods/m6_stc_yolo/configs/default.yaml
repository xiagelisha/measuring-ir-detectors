# STC-YOLO base config — mirrors paper3 tuned recipe (the strongest single-frame
# YOLOv12s recipe per JRTIP submission). All STC-YOLO innovations layer on top of
# this baseline; per-innovation overrides go in ssl_pretrain.yaml / semi_supervised.yaml.
model: stc_yolo

# --- ultralytics training args (paper3 tuned recipe) ---
# Paper3 §3.4: AdamW + lr 1e-3 + 30ep + imgsz 800 + mixup 0.1 + infer 1056 + augment.
# 30-ep is itself a tuning choice: longer schedules lock onto early-epoch outliers.
epochs: 30
imgsz: 800
batch: 8
workers: 4
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0001
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
patience: 20
amp: true
device: 0
cos_lr: true
close_mosaic: 10
mosaic: 1.0
mixup: 0.1
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
seed: 42
deterministic: true
verbose: true
plots: true
save: true
save_period: -1
val: true
exist_ok: true

# --- STC-YOLO module switches ---
# All disabled by default → this config reduces to paper3 tuned YOLOv12s baseline.
# Per-milestone configs flip these as we add modules.
stc:
  # C4 — Colormap inversion input (MS1 D2/D3)
  enable_colormap_inversion: false
  colormap_inverter_ckpt: null      # null = analytic LUT inversion (no MLP)
  # C1 — SSL pretrain init (MS2)
  ssl_pretrained_backbone: null      # null = use ImageNet-pretrained yolo12s.pt
  # C3 — Session-FiLM detect head (MS3)
  # NOTE: day_night column in metadata.csv is a misnomer (it carries the
  # filename `c` token = class encoding). Dropped from FiLM input to avoid
  # label leakage. See methods/m6_stc_yolo/data/session_metadata.py docstring.
  enable_session_film: false
  film_metadata_keys: [temperature, location, condition]
  film_inject_levels: [P3, P4, P5]
  # C2 — Mean Teacher semi-supervised (MS3)
  enable_mean_teacher: false
  mt_ema_momentum: 0.999
  mt_pseudo_conf_threshold: 0.5
  mt_consistency_weight_max: 1.0
  mt_consistency_rampup_epochs: 10
  mt_neighbor_gap_max: 3              # sample unlabeled neighbors with gap in {1..3}
  # C5 — Test-time 1-frame voting (MS4, inference-only)
  enable_temporal_voting: false
  voting_buffer_size: 2
  voting_conf_low: 0.25
  voting_conf_high: 0.6
  voting_iou_threshold: 0.5

# --- inference / TTA (paper3 sweet spot) ---
infer:
  imgsz: 1056
  augment: true        # ultralytics built-in TTA (h-flip + 3-scale)
  conf: 0.001
  iou: 0.6
