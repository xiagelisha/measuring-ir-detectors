# Default training config for tier-1 ultralytics baselines.
epochs: 200
imgsz: 640
batch: 16
workers: 4
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0001
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
patience: 50
amp: true
device: 0
cos_lr: true
close_mosaic: 10
mosaic: 1.0
mixup: 0.1
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
seed: 42
deterministic: true
verbose: true
plots: true
save: true
save_period: -1
val: true
exist_ok: true
